<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Analisador Educacional</title>
  <style>
    body { font-family: system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; margin: 0; background: #f5f5f7; color: #1d1d1f; }
    main { text-align: center; padding: 2rem; background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
    h1 { margin: 0 0 .5rem; }
    #status { font-size: .9rem; color: #6e6e73; }
    .erro { color: #c0392b; }
  </style>
</head>
<body>
  <main>
    <h1 id="mensagem">Carregando...</h1>
    <p id="status">Consultando o backend em /api/hello</p>
  </main>
  <script>
    fetch("/api/hello")
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (dados) {
        document.getElementById("mensagem").textContent = dados.message;
        document.getElementById("status").textContent = "Frontend e backend se comunicando.";
      })
      .catch(function (e) {
        var s = document.getElementById("status");
        document.getElementById("mensagem").textContent = "Erro";
        s.textContent = "Não foi possível contatar o backend (" + e.message + ").";
        s.className = "erro";
      });
  </script>
</body>
</html>
